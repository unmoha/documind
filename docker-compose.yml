services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: documind-api
    restart: unless-stopped
    ports:
      - "${DOCUMIND_API_PORT:-8000}:8000"
    environment:
      - DOCUMIND_ENV=production
      - DOCUMIND_LOG_LEVEL=${DOCUMIND_LOG_LEVEL:-INFO}
      - DOCUMIND_API_HOST=0.0.0.0
      - DOCUMIND_API_PORT=8000
      - DOCUMIND_CHROMA_PERSIST_DIR=/app/data/chroma
      - DOCUMIND_SQLITE_DB_PATH=/app/data/logs/logs.sqlite
      # Optional API protection token
      - DOCUMIND_API_TOKEN=${DOCUMIND_API_TOKEN:-}
      # Gemini API key read from host environment or .env file
      - DOCUMIND_GEMINI_API_KEY=${DOCUMIND_GEMINI_API_KEY:-${GEMINI_API_KEY:-}}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-${DOCUMIND_GEMINI_API_KEY:-}}
    volumes:
      - chroma_data:/app/data/chroma
      - sqlite_data:/app/data/logs
      - hf_cache:/home/documind/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: documind-ui
    restart: unless-stopped
    command: ["streamlit", "run", "ui/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "${DOCUMIND_STREAMLIT_PORT:-8501}:8501"
    environment:
      - DOCUMIND_API_URL=http://api:8000
      - DOCUMIND_API_TOKEN=${DOCUMIND_API_TOKEN:-}
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    depends_on:
      api:
        condition: service_healthy

volumes:
  chroma_data:
    name: documind_chroma_data
  sqlite_data:
    name: documind_sqlite_data
  hf_cache:
    name: documind_hf_cache
